server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxied to the backend container over the docker network — same origin as
    # the frontend from the browser's point of view, so no CORS round-trip.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA client-side routing (react-router) — unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}

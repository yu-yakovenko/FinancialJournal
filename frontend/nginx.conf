server {
    listen 80;
    server_name tonique-finance.duckdns.org;

    # Certbot's webroot plugin drops its verification token here; must stay
    # reachable over plain HTTP even after HTTPS is enabled (renewals repeat this).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name tonique-finance.duckdns.org;

    # Path is fixed by certbot (it names the dir after the -d value passed at
    # issuance) — must match the DOMAIN used in init-letsencrypt.sh exactly.
    ssl_certificate /etc/letsencrypt/live/tonique-finance.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tonique-finance.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;

    # Proxied to the backend container over the docker network — same origin as
    # the frontend from the browser's point of view, so no CORS round-trip.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA client-side routing (react-router) — unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
